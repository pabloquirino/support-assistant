server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Margem acima do limite de 10 MB de PDF (validado de fato na API)
  client_max_body_size 12m;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Ícones têm nome fixo (sem hash): cache curto para uma troca de ícone chegar aos usuários
  location ~* ^/(favicon\.ico|favicon-192\.png|apple-touch-icon\.png|icone\.png)$ {
    expires 7d;
    try_files $uri =404;
  }

  # Assets com hash no nome: cache longo
  location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Fallback da SPA
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}