<div class="flex min-h-0 flex-1 flex-col">
  <div #scroller class="min-h-0 flex-1 overflow-y-auto" role="log" aria-label="Conversa">
    <div class="mx-auto flex max-w-3xl flex-col gap-5 px-4 py-6 md:py-10">
      @for (m of store.messages(); track m.id) {
        <app-message
          [attr.data-message-id]="m.id"
          [message]="m"
          [disabled]="store.busy()"
          [active]="m.id === store.activeNodeId()"
          (categoryPicked)="store.pickCategory(m.id, $event)"
          (topicPicked)="store.pickTopic(m.id, $event)"
          (optionPicked)="store.answer(m.id, $event)"
          (backClicked)="store.goBack()"
          (restartClicked)="store.restartFlow()"
          (feedbackGiven)="store.sendFeedback(m.id, $event)"
        />
      }

      @if (store.busy()) {
        <div class="flex items-start gap-3">
          <app-bot-avatar />
          <div
            class="flex items-center gap-1 rounded-2xl rounded-tl-sm bg-surface px-4 py-3.5 shadow-sm ring-1 ring-slate-200"
            role="status"
            aria-label="Buscando"
          >
            <span class="size-1.5 animate-bounce rounded-full bg-slate-400"></span>
            <span class="size-1.5 animate-bounce rounded-full bg-slate-400 [animation-delay:150ms]"></span>
            <span class="size-1.5 animate-bounce rounded-full bg-slate-400 [animation-delay:300ms]"></span>
          </div>
        </div>
      }
    </div>
  </div>

  <!-- Composer: flutua sobre um degradê do fundo, como nos chats de LLM. -->
  <div class="shrink-0 bg-linear-to-t from-slate-100 from-60% to-transparent px-4 pb-4 pt-2">
    <div class="mx-auto max-w-3xl">
      <app-chat-input [disabled]="store.busy()" (submitted)="store.send($event)" />
      <p class="mt-2 text-center text-xs text-slate-500">
        Respostas vêm dos procedimentos cadastrados pela equipe, sem IA.
      </p>
    </div>
  </div>
</div>
